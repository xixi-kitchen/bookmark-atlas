name: Feature request
description: Suggest a focused improvement or workflow
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Tell us about the workflow you want to improve, not just the feature name.

        请说明你希望改善的实际使用场景，而不只是功能名称。
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow / 问题或使用场景
      placeholder: I want to... / 我希望能够……
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed behavior / 期望表现
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround / 当前替代方法
  - type: checkboxes
    id: scope
    attributes:
      label: Scope / 范围
      options:
        - label: This request is for same-browser behavior and does not require cross-browser synchronization. / 此需求不要求跨浏览器同步。
        - label: I understand new permissions or remote data processing require a separate privacy review. / 我理解新增权限或远程数据处理需要单独进行隐私审查。

