          <p class="project-support-intro">自愿支持用于 Bookmark Atlas 的维护与开发，不解锁功能，也不影响现有功能使用。</p>
        </div>
        <div class="project-support-ko-fi">
          <a class="project-support-ko-fi__button is-localized" data-support-channel="ko-fi" href="https://ko-fi.com/xixikitchen/" target="_blank" rel="noopener noreferrer"><img src="../support-assets/ko-fi-cup.avif" width="28" height="28" alt=""><span>通过 Ko-fi 支持</span></a>

        </div>
      </div>
      <section class="project-support-scan" aria-labelledby="support-scan-title">
        <div class="project-support-scan__intro">
          <h2 id="support-scan-title">中国大陆扫码支持</h2>
          <p>使用对应支付应用扫码。确认付款前，请核对应用显示的收款人和金额。</p>
        </div>
        <div class="project-support-methods">
          <figure class="project-support-qr project-support-qr--wechat">
              <figcaption><h3>微信支付</h3></figcaption>
              <img data-payment-code="wechat" src="../support-assets/wechat.jpg" alt="微信支付 · 自愿支持收款码" referrerpolicy="no-referrer" decoding="async">
              <a href="../support-assets/wechat.jpg" target="_blank" rel="noopener noreferrer" aria-label="微信支付 · 打开原尺寸收款码">打开原尺寸收款码</a>
            </figure>
          <figure class="project-support-qr project-support-qr--alipay">

              <img data-payment-code="alipay" src="../support-assets/alipay.jpg" alt="支付宝 · 自愿支持收款码" referrerpolicy="no-referrer" decoding="async">
              <a href="../support-assets/alipay.jpg" target="_blank" rel="noopener noreferrer" aria-label="支付宝 · 打开原尺寸收款码">打开原尺寸收款码</a>
            </figure>
